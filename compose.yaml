services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: citylens
      POSTGRES_USER: citylens
      POSTGRES_PASSWORD: ${CITYLENS_DB_PASSWORD:?Set CITYLENS_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - citylens_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citylens -d citylens"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  citylens_db:
