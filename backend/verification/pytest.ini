[pytest]
testpaths = .
pythonpath = .
addopts = -ra --strict-markers
markers =
    db: needs the isolated TEST_DATABASE_URL database (skipped when unset)
    realdata: loads the full raw CSVs into the test database (opt-in: --run-realdata)
    probe: records observed behavior for an undocumented requirement; never a pass/fail of the contract
